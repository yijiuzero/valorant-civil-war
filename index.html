﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<meta name="color-scheme" content="light dark">
<title>无畏契约 · 战术转盘·仅限云南瓦搭群使用</title>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="sidebar">
  <div class="sidebar-logo">
    <h1>⚡ VALORANT</h1>
    <span>战术工具集</span>
  </div>
  <ul class="nav-list">
    <li class="nav-item active" data-module="home"><span class="nav-icon">🏠</span><span>首页</span></li>
    <li class="nav-item" data-module="wheel"><span class="nav-icon">🎯</span><span>随机选图</span></li>
    <li class="nav-item" data-module="agent"><span class="nav-icon">🧩</span><span>随机特工</span></li>
    <li class="nav-item" data-module="stats"><span class="nav-icon">📊</span><span>内战专用</span></li>
  </ul>
  <div class="sidebar-footer">V2.0.0 · from zer0</div>
</nav>

<main id="mainArea">
  <!-- 首页内容 -->
  <div class="content-layer" id="module-home">
    <div class="module-title">🏠 无畏契约 · 战术工具集</div>
    <div class="module-sub">专为云南瓦搭群打造 | from zer0</div>
    <div style="display:flex;gap:20px;flex-wrap:wrap;justify-content:center;margin-top:20px;">
      <div class="home-card" onclick="switchModule('wheel')"><div class="home-card-icon">🎯</div><div class="home-card-title">随机选图</div><div class="home-card-desc">随机抽取地图</div></div>
      <div class="home-card" onclick="switchModule('agent')"><div class="home-card-icon">🧩</div><div class="home-card-title">随机特工</div><div class="home-card-desc">随机抽取特工</div></div>
      <div class="home-card" onclick="switchModule('stats')"><div class="home-card-icon">📊</div><div class="home-card-title">内战专用</div><div class="home-card-desc">内战转盘</div></div>
    </div>
  </div>

  <!-- 随机选图内容 -->
  <div class="content-layer" id="module-wheel" style="display:none;">
    <div class="module-title">🎯 随机选图</div>
    <div class="module-sub">选择数量,点击抽取,随机选取无畏契约地图</div>
    <div class="map-count">
      <span>抽取数量:</span>
      <button class="mc-btn active" data-count="1">1</button>
      <button class="mc-btn" data-count="2">2</button>
      <button class="mc-btn" data-count="3">3</button>
      <button class="mc-btn" data-count="4">4</button>
      <button class="mc-btn" data-count="5">5</button>
    </div>
    <div class="ban-status" id="banStatus" style="display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:13px;color:var(--text-dim);justify-content:center;">
      <span id="banCount"></span>
      <button id="btnResetBan">重置</button>
    </div>
    <div class="map-cards" id="mapCards"></div>
    <button class="btn-spin" id="btnSpin" onclick="drawMaps()">随机抽取 🎰</button>
    <div class="map-results" id="mapResults"></div>
  </div>

  <!-- 随机特工内容 -->
  <div class="content-layer" id="module-agent" style="display:none;">
    <div class="module-title">🧩 随机特工</div>
    <div class="module-sub">筛选角色,选择数量,点击抽取</div>
    <div class="agent-filters" id="agentFilters">
      <button class="af-btn active" data-role="all">全部</button>
      <button class="af-btn" data-role="决斗者">⚔️ 决斗者</button>
      <button class="af-btn" data-role="先锋">🔍 先锋</button>
      <button class="af-btn" data-role="控场者">💨 控场者</button>
      <button class="af-btn" data-role="哨卫">🛡️ 哨卫</button>
    </div>
    <div class="agent-count">
      <span>抽取数量:</span>
      <button class="ac-btn active" data-count="1">1</button>
      <button class="ac-btn" data-count="2">2</button>
      <button class="ac-btn" data-count="3">3</button>
      <button class="ac-btn" data-count="4">4</button>
      <button class="ac-btn" data-count="5">5</button>
      <button class="ac-mode-btn" id="btnChampionComp">冠军阵容</button>
    </div>
    <div class="agent-grid" id="agentGrid"></div>
    <button class="btn-spin" id="btnAgent" onclick="randomAgent()">随机抽取 🎲</button>
    <div class="agent-results" id="agentResults"></div>
  </div>

  <!-- 内战专用 - 转盘 -->
  <div class="content-layer" id="module-stats" style="display:none;">
    <div class="module-title">📊 内战专用</div>
    <div class="module-sub">内战转盘 · 随机抽取挑战规则</div>
    <div class="challenge-machine">
      <div class="machine-deco"><span class="machine-dot"></span><span class="machine-dot"></span><span class="machine-dot"></span></div>
      <div class="machine-frame">
        <div class="machine-label">RANDOM CHALLENGE</div>
        <div class="machine-display">
          <div class="machine-text idle" id="challengeText">点击下方按钮 抽取挑战规则</div>
        </div>
        <div class="machine-controls">
          <button class="btn-machine" id="btnChallengeSpin" onclick="spinChallenge()">随机抽取</button>
        </div>
      </div>
      <div class="challenge-count" id="challengeCount"></div>
      <div class="challenge-history" id="challengeHistory"></div>
    </div>
  </div>
</main>
<button id="themeToggle" aria-label="切换主题" title="切换主题" style="position:fixed;right:16px;top:16px;width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;z-index:120;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.12);transition:transform .15s;">🌙</button>
<div id="globalToast"></div>

  <script src="app-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
